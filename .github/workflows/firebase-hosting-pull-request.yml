name: Deploy preview on PR
on: pull_request

# The repository's default GITHUB_TOKEN is read-only, so the Firebase
# action's attempt to create its "Deploy Preview" check run came back
# 403 (x-accepted-github-permissions: checks=write). Requesting the
# two scopes it actually needs, and nothing more.
permissions:
  contents: read
  checks: write
  pull-requests: write

# Preview channels deploy hosting only. Functions and Firestore
# rules are project-wide, not per-channel, so deploying them from a
# pull request would push unreviewed backend changes to production.
jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}
          projectId: the-1p-leadership
