name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# This job only reads the repo and deploys to Firebase. It does not
# touch the GitHub API, so contents:read is all it needs.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # firebase-tools needs the function dependencies present locally
      # to analyse and package the functions before uploading them.
      - name: Install function dependencies
        working-directory: functions
        run: npm install

      # Refuses to continue if this repo is configured in a way that
      # could damage the member portal, which shares this Firebase
      # project. See scripts/check-deploy-safety.mjs. This runs BEFORE
      # authentication so a bad config cannot reach the project at all.
      - name: Deploy safety checks
        run: node scripts/check-deploy-safety.mjs

      - name: Authenticate to Firebase
        id: auth
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}

      # Deployed as separate steps on purpose. firebase-tools runs
      # preflight checks across every target before releasing any of
      # them, so one combined command aborts the whole deploy if a
      # single target is not permitted. That is what happened on the
      # first run: a missing IAM role on functions stopped the static
      # hosting deploy from shipping at all, even though hosting has
      # no dependency on it.
      #
      # Hosting and functions only. Firestore rules and indexes are
      # project-wide and single-source, and the portal repo owns them,
      # so nothing here deploys them.
      #
      # Each step carries its own condition so a failure in one does
      # not skip the other.
      # Hosting is NOT deployed from this repo. The member portal repo
      # (the1percentnation-collab/The-1P-Leadership) owns the hosting
      # site and carries every page, including this repo's class funnel
      # and the matrix mastermind page. Both repos deploying hosting to
      # the same site meant each deploy replaced the other's pages —
      # deploys from here wiped the portal's login and dashboard off
      # the live site between Aug 22 and 23. Page edits belong in the
      # portal repo's public/ directory now.

      # Scoped to the `classes` codebase, and that scoping is load
      # bearing. The member portal (repo the-1p-leadership) deploys 53
      # functions into this SAME Firebase project. An unscoped
      # `--only functions` compares every deployed function against
      # this source tree, decides the portal's are stale, and tries to
      # delete all of them. Firebase refused because the run is
      # non-interactive, which is the only reason the portal survived
      # the first attempt.
      #
      # Never add --force here, and never widen this back to
      # `--only functions`.
      - name: Deploy Cloud Functions
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx --yes firebase-tools@13 deploy --only functions:classes --project the-1p-leadership --non-interactive

      # The class page reads its copy, price, and capacity from a
      # Firestore document, and getClassState returns not-found until
      # that document exists. Deploying working functions with no class
      # record produced a page that looked broken, so creating it is
      # part of deploying rather than a step someone has to remember.
      #
      # Safe on every run: the seed leaves an existing class untouched
      # unless FORCE=1, so it cannot overwrite copy edited in /admin.
      - name: Seed the class if it does not exist
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        working-directory: functions
        run: node scripts/seed-matrix.js
        env:
          GCLOUD_PROJECT: the-1p-leadership

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
