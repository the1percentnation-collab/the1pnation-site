name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# This job only reads the repo and deploys to Firebase. It does not
# touch the GitHub API, so contents:read is all it needs.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Functions carry the Stripe, SendGrid, and CRM logic, so a
      # deploy that shipped only hosting would leave the pages
      # calling endpoints that no longer match them.
      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Firebase
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}

      - name: Deploy hosting, functions, and Firestore rules
        run: npx --yes firebase-tools@13 deploy --only hosting,functions,firestore --project the-1p-leadership --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
