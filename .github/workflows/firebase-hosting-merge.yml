name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# This job only reads the repo and deploys to Firebase. It does not
# touch the GitHub API, so contents:read is all it needs.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # firebase-tools needs the function dependencies present locally
      # to analyse and package the functions before uploading them.
      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Firebase
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}

      # Deployed as separate steps on purpose. firebase-tools runs
      # preflight checks across every target before releasing any of
      # them, so one combined command aborts the whole deploy if a
      # single target is not permitted. That is what happened on the
      # first run: a missing IAM role on functions stopped the static
      # hosting deploy from shipping at all, even though hosting has
      # no dependency on it.
      #
      # Hosting is static and deploys on the Spark plan with no extra
      # roles, so it goes first and lands regardless of the rest.
      - name: Deploy hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project the-1p-leadership --non-interactive

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@13 deploy --only firestore --project the-1p-leadership --non-interactive

      # Requires the Blaze plan, and requires the deploying service
      # account to hold the Service Account User role so it can act as
      # the runtime service account. Until both are in place this step
      # fails and the run shows red, which is the honest signal: the
      # site is live but the signup backend is not.
      - name: Deploy Cloud Functions
        run: npx --yes firebase-tools@13 deploy --only functions --project the-1p-leadership --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
